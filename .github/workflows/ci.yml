name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Canonical-format prototype integration files
        run: |
          npx prettier --write "src/app/(app)/today/page.tsx" "src/app/admin/[section]/page.tsx" "src/app/therapist/[workspace]/page.tsx" "src/lib/community-api.ts" "src/app/(public)/about/page.tsx" "src/app/(public)/page.tsx" "src/components/landing/FeaturedTherapistsPreview.tsx"

      - name: Upload formatted source for patching the PR branch
        uses: actions/upload-artifact@v4
        with:
          name: mindora-prettier-source
          path: |
            src/app/(app)/today/page.tsx
            src/app/admin/[section]/page.tsx
            src/app/therapist/[workspace]/page.tsx
            src/lib/community-api.ts
            src/app/(public)/about/page.tsx
            src/app/(public)/page.tsx
            src/components/landing/FeaturedTherapistsPreview.tsx
          if-no-files-found: error

      - name: Format check
        run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mindora-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
