name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check out PR source branch for canonical formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          git checkout -B "${{ github.event.pull_request.head.ref }}" "origin/${{ github.event.pull_request.head.ref }}"

      - name: Canonical-format prototype integration files
        run: |
          npx prettier --write "src/app/(app)/therapy/page.tsx" "src/app/(app)/today/page.tsx" "src/app/admin/[section]/page.tsx" "src/app/therapist/[workspace]/page.tsx" "src/app/therapist/dashboard/page.tsx" "src/app/therapist/page.tsx" "src/hooks/useClinicalWorkspace.ts" "src/lib/clinical-workspace-api.ts" "src/lib/community-api.ts"

      - name: Upload formatted source for patching the PR branch
        uses: actions/upload-artifact@v4
        with:
          name: mindora-prettier-source
          path: |
            src/app/(app)/therapy/page.tsx
            src/app/(app)/today/page.tsx
            src/app/admin/[section]/page.tsx
            src/app/therapist/[workspace]/page.tsx
            src/app/therapist/dashboard/page.tsx
            src/app/therapist/page.tsx
            src/hooks/useClinicalWorkspace.ts
            src/lib/clinical-workspace-api.ts
            src/lib/community-api.ts
          if-no-files-found: error

      - name: Commit canonical formatting to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [[ -n "$(git status --porcelain -- src/app/(app)/therapy/page.tsx)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "src/app/(app)/therapy/page.tsx"
            git commit -m "style: format patient medication update screen"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Format check
        run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: mindora-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
