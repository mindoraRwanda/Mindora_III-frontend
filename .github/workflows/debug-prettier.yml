name: Temporary Prettier diagnosis

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/home/WeeklyMoodCard.tsx"
      - "src/components/messaging/MessagesView.tsx"
      - ".github/workflows/debug-prettier.yml"

permissions:
  contents: read

jobs:
  format-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Print canonical Prettier output
        run: |
          echo "::group::WeeklyMoodCard.tsx"
          npx prettier src/components/home/WeeklyMoodCard.tsx
          echo "::endgroup::"
          echo "::group::MessagesView.tsx"
          npx prettier src/components/messaging/MessagesView.tsx
          echo "::endgroup::"
