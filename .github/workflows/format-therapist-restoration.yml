name: Format restored therapist files
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format restored files
        run: npx prettier --write 'src/app/therapist/[workspace]/page.tsx' src/app/therapist/dashboard/page.tsx src/app/therapist/page.tsx src/components/layout/TherapistSidebar.tsx src/hooks/useClinicalWorkspace.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/therapist/[workspace]/page.tsx' src/app/therapist/dashboard/page.tsx src/app/therapist/page.tsx src/components/layout/TherapistSidebar.tsx src/hooks/useClinicalWorkspace.ts
          git diff --cached --quiet || (git commit -m "chore: format restored therapist files" && git push origin HEAD:${{ github.event.pull_request.head.ref }})
